services:
  dev:
    build: .
    volumes:
      - .:/app
    environment:
      - CC=clang
      - CXX=clang++
    # Keeps the container running so you can exec into it
    tty: true
    stdin_open: true
    working_dir: /app
    command: air
    develop:
      watch:
        - path: .
          action: sync
          target: /app
          ignore:
            - build/
            - vcpkg_installed/
            - .git/
